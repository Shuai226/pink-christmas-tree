<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Merry Christmas · To: Zhang Aoyun</title>
<style>
  :root{
    --bg:#0a0512;
    --pink:#ffb3d4;
    --pink-deep:#f06ba5;
    --rose:#e86a9c;
    --pearl:#ffe9f3;
    --muted:rgba(255,228,240,.6);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;color:var(--pearl)}
  #scene{position:fixed;inset:0;display:block}

  /* ---------- 标题 ---------- */
  .hero{position:absolute;top:34px;left:50%;transform:translateX(-50%);z-index:10;text-align:center;pointer-events:none}
  .eyebrow{font-size:12px;letter-spacing:.42em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  .hero h1{
    font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:700;
    font-size:clamp(32px,5.4vw,52px);line-height:1.05;white-space:nowrap;
    background:linear-gradient(120deg,#fff0f7 5%,var(--pink) 50%,#e86a9c 95%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 30px rgba(255,158,198,.25);
  }
  .hero .wish{margin-top:10px;font-size:13px;color:var(--muted);letter-spacing:.14em}

  /* ---------- 落款 To ---------- */
  .to-sign{
    position:absolute;bottom:44px;left:50%;transform:translateX(-50%);z-index:10;
    text-align:center;pointer-events:none;
  }
  .to-sign .line{
    display:inline-block;padding:10px 28px;border-top:1px solid rgba(255,179,212,.35);
    border-bottom:1px solid rgba(255,179,212,.35);
  }
  .to-sign .to{
    font-family:Georgia,serif;font-style:italic;font-size:clamp(18px,2.4vw,24px);
    color:var(--pink);letter-spacing:.06em;
  }
  .to-sign .to b{color:var(--pearl);font-weight:700}
  .to-sign .note{margin-top:8px;font-size:11px;color:var(--muted);letter-spacing:.2em}

  /* ---------- 开场问候 ---------- */
  .intro{position:absolute;inset:0;z-index:15;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:20vh;pointer-events:none;transition:opacity 1.2s}
  .intro h2{font-family:Georgia,serif;font-style:italic;font-size:clamp(34px,5vw,52px);color:var(--pearl);text-shadow:0 0 30px rgba(255,158,198,.35)}
  .intro p{margin-top:10px;color:var(--muted);letter-spacing:.18em;font-size:14px}
  .intro.hide{opacity:0}

  .hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:10;font-size:11px;color:var(--muted);letter-spacing:.12em;opacity:.7}
</style>
</head>
<body>
<canvas id="scene"></canvas>

<!-- 顶部英文标题 -->
<div class="hero">
  <div class="eyebrow">Christmas Night</div>
  <h1>Merry Christmas</h1>
  <div class="wish">May your holidays be wrapped in warmth and wonder</div>
</div>

<!-- 落款 -->
<div class="to-sign">
  <div class="line"><span class="to">To: <b>Zhang Aoyun</b></span></div>
  <div class="note">WITH LOVE · THIS CHRISTMAS</div>
</div>

<!-- 开场问候 -->
<div class="intro" id="intro">
  <h2>Merry Christmas</h2>
  <p>To: Zhang Aoyun</p>
</div>

<div class="hint">click anywhere to sparkle</div>

<script>
(() => {
  "use strict";
  const canvas = document.getElementById("scene");
  const ctx = canvas.getContext("2d");
  let W = 0, H = 0, DPR = 1, unit = 60, groundY = 0;

  const TREE_H = 10;
  const TREE_R = 4.2;
  const PARTICLE_COUNT = 5200;

  const palette = {
    main: "#ffb3d4",   // 主粉
    deep: "#f06ba5",   // 深玫粉
    pearl: "#ffe9f3",  // 粉白
    gift: ["#e86a9c", "#ff9ec6", "#d94f86", "#8a4f7a"],
  };

  const skipIntro = /[?&]ready=1/.test(location.search);
  const state = {
    rot: 0,
    time: 0,
    intro: skipIntro ? 1 : 0,
  };

  /* ---------------- 背景星空 ---------------- */
  let stars = [];
  function initStars(){
    stars = [];
    const n = Math.round(W * H / 9000);
    for(let i=0;i<n;i++){
      stars.push({x:Math.random()*W, y:Math.random()*H, r:Math.random()*1.4+.3, p:Math.random()*Math.PI*2, s:.5+Math.random()});
    }
  }

  /* ---------------- 飘雪 ---------------- */
  let flakes = [];
  function initFlakes(){
    flakes = [];
    for(let i=0;i<130;i++){
      flakes.push({x:Math.random()*W, y:Math.random()*H, r:Math.random()*2+.6, v:.3+Math.random()*.9, d:Math.random()*Math.PI*2});
    }
  }

  /* ---------------- 树粒子 ---------------- */
  let particles = [];
  function buildParticles(){
    particles = [];
    for(let i=0;i<PARTICLE_COUNT;i++){
      const t = Math.pow(Math.random(), .72);
      const y = t * TREE_H;
      const rMax = TREE_R * (1 - y / TREE_H);
      const r = rMax * Math.sqrt(Math.random());
      const theta = Math.random() * Math.PI * 2;
      particles.push({
        r, theta, y,
        jitter: Math.random()*Math.PI*2,
        size: Math.random()*1.2+.7,
        warm: Math.random(),
      });
    }
  }

  /* ---------------- 礼物 / 彩球 ---------------- */
  let gifts = [], baubles = [];
  function buildOrnaments(){
    gifts = []; baubles = [];
    for(let i=0;i<70;i++){
      const a = Math.random()*Math.PI*2;
      const r = TREE_R*(0.35+Math.random()*0.85);
      gifts.push({x:Math.cos(a)*r, z:Math.sin(a)*r, y:Math.random()*1.0+.1, s:.11+Math.random()*.12, rot:Math.random()*Math.PI, spin:(Math.random()-.5)*.8, color:palette.gift[Math.floor(Math.random()*palette.gift.length)]});
    }
    for(let i=0;i<90;i++){
      const t = Math.pow(Math.random(),.6);
      const y = t*TREE_H*.95+.3;
      const rMax = TREE_R*(1-y/TREE_H);
      const r = rMax*(.75+Math.random()*.3);
      const a = Math.random()*Math.PI*2;
      baubles.push({x:Math.cos(a)*r, z:Math.sin(a)*r, y, s:.05+Math.random()*.07, pearl:Math.random()>.4, phase:Math.random()*Math.PI*2});
    }
  }

  /* ---------------- 投影（伪 3D） ---------------- */
  function project(x,y,z){
    const c = Math.cos(state.rot), s = Math.sin(state.rot);
    const xr = x*c - z*s;
    const zr = x*s + z*c;
    const persp = 1600/(1600 + zr*70);
    return {
      sx: W/2 + xr*unit*persp,
      sy: groundY - y*unit*persp + zr*.12*unit,
      depth: zr, persp,
    };
  }

  /* ---------------- 绘制 ---------------- */
  function drawBackground(){
    const g = ctx.createRadialGradient(W/2, H*.55, 60, W/2, H*.55, Math.max(W,H)*.8);
    g.addColorStop(0, "#2a1430");
    g.addColorStop(.55, "#170a20");
    g.addColorStop(1, "#0a0512");
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);

    const glow = ctx.createRadialGradient(W/2, groundY-TREE_H*unit*.4, 10, W/2, groundY-TREE_H*unit*.4, TREE_R*unit*1.4);
    glow.addColorStop(0, "rgba(255,158,198,.18)");
    glow.addColorStop(1, "rgba(255,158,198,0)");
    ctx.fillStyle = glow;
    ctx.fillRect(0,0,W,H);

    for(const st of stars){
      const tw = .5 + .5*Math.sin(state.time*st.s + st.p);
      ctx.globalAlpha = .35 + .55*tw;
      ctx.fillStyle = "#ffe9f3";
      ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawGround(){
    const gw = TREE_R*unit*2.4, gh = gw*.22;
    const g = ctx.createRadialGradient(W/2, groundY, 10, W/2, groundY, gw/2);
    g.addColorStop(0, "rgba(255,235,244,.95)");
    g.addColorStop(.55, "rgba(232,180,208,.55)");
    g.addColorStop(1, "rgba(232,180,208,0)");
    ctx.save();
    ctx.translate(W/2, groundY);
    ctx.scale(1, gh/(gw/2));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0,0,gw/2,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function drawSpiralRibbon(){
    const turns = 3.4, L = 120;
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.strokeStyle = "rgba(255,190,220,.5)";
    ctx.lineWidth = 1.6;
    ctx.shadowColor = "rgba(255,170,205,.6)";
    ctx.shadowBlur = 6;
    ctx.beginPath();
    let started = false;
    for(let i=0;i<=L;i++){
      const t = i/L;
      const y = t*TREE_H;
      const r = TREE_R*(1-y/TREE_H)*.9;
      const a = t*turns*Math.PI*2 + state.rot;
      const p = project(Math.cos(a)*r, y, Math.sin(a)*r);
      if(!started){ctx.moveTo(p.sx,p.sy);started=true;} else ctx.lineTo(p.sx,p.sy);
    }
    ctx.stroke();
    ctx.restore();
  }

  function drawTreeParticles(){
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    const introEase = easeOutCubic(Math.min(1, state.intro));
    const c = Math.cos(state.rot), s = Math.sin(state.rot);
    for(const p of particles){
      let tx = p.r*Math.cos(p.theta), tz = p.r*Math.sin(p.theta), ty = p.y;
      if(introEase < 1){
        const it = introEase;
        tx = tx*it + (1-it)*Math.cos(p.jitter)*.6;
        tz = tz*it + (1-it)*Math.sin(p.jitter)*.6;
        ty = ty*it + (1-it)*(-1.5);
      }
      const xr = tx*c - tz*s, zr = tx*s + tz*c;
      const persp = 1600/(1600+zr*70);
      const sx = W/2 + xr*unit*persp;
      const sy = groundY - ty*unit*persp + zr*.12*unit;
      const depthA = .6 + .4*((zr+TREE_R)/(TREE_R*2));
      const size = p.size*persp;
      const col = p.warm > .85 ? palette.deep : (p.warm > .3 ? palette.main : palette.pearl);
      ctx.globalAlpha = Math.min(1, depthA*(0.7+0.3*p.warm));
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(sx, sy, size, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }

  function drawTopStar(){
    const p = project(0, TREE_H+.35, 0);
    const pulse = 1 + .12*Math.sin(state.time*3);
    const R = .42*unit*p.persp*pulse, r = R*.45;
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.shadowColor = "#ffdcec"; ctx.shadowBlur = 24;
    ctx.fillStyle = "#ffdcec";
    ctx.beginPath();
    for(let i=0;i<10;i++){
      const ang = -Math.PI/2 + i*Math.PI/5;
      const rad = i%2===0 ? R : r;
      const x = p.sx + Math.cos(ang)*rad, y = p.sy + Math.sin(ang)*rad;
      i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    }
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function drawGifts(){
    ctx.save();
    for(const g of gifts){
      const rot = g.rot + state.time*g.spin;
      const p = project(g.x, g.y, g.z);
      const s = g.s*unit*p.persp;
      ctx.save();
      ctx.translate(p.sx, p.sy);
      ctx.rotate(rot*.3);
      ctx.fillStyle = g.color;
      ctx.fillRect(-s/2, -s/2, s, s);
      ctx.fillStyle = "rgba(255,255,255,.28)";
      ctx.fillRect(-s/2, -s*.1, s, s*.2);
      ctx.fillRect(-s*.1, -s/2, s*.2, s);
      ctx.restore();
    }
    ctx.restore();
  }

  function drawBaubles(){
    ctx.save();
    for(const b of baubles){
      const p = project(b.x, b.y, b.z);
      const s = b.s*unit*p.persp;
      ctx.fillStyle = b.pearl ? "#ffc2dd" : "#e86a9c";
      ctx.beginPath(); ctx.arc(p.sx, p.sy, s, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.5)";
      ctx.beginPath(); ctx.arc(p.sx-s*.3, p.sy-s*.3, s*.28, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }

  function drawFlakes(){
    ctx.save();
    ctx.fillStyle = "rgba(255,238,247,.8)";
    for(const f of flakes){
      f.y += f.v; f.x += Math.sin(state.time + f.d)*.3;
      if(f.y > H+5){f.y=-5; f.x=Math.random()*W;}
      ctx.globalAlpha = .4 + .4*Math.random();
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }

  /* ---------------- 主循环 ---------------- */
  let last = performance.now();
  function loop(now){
    const dt = Math.min(.05, (now-last)/1000); last = now;
    state.time += dt;
    state.rot += dt*.18;
    if(state.intro < 1) state.intro = Math.min(1, state.intro + dt/3.2);

    drawBackground();
    drawGround();
    drawSpiralRibbon();
    drawTreeParticles();
    drawGifts();
    drawBaubles();
    drawTopStar();
    drawFlakes();

    requestAnimationFrame(loop);
  }

  function easeOutCubic(t){ return 1 - Math.pow(1-t, 3); }

  // 点击绽放粉色星光
  canvas.addEventListener("pointerdown", e=>{
    for(let i=0;i<24;i++){
      const a = Math.random()*Math.PI*2, v = 1+Math.random()*3;
      flakes.push({x:e.clientX, y:e.clientY, r:Math.random()*2+1, v:Math.cos(a)*v*.4, d:a});
    }
  });

  /* ---------------- 尺寸 ---------------- */
  function resize(){
    DPR = Math.min(2, window.devicePixelRatio||1);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W*DPR; canvas.height = H*DPR;
    canvas.style.width = W+"px"; canvas.style.height = H+"px";
    ctx.setTransform(DPR,0,0,DPR,0,0);
    unit = Math.min(W,H)*.052;
    groundY = H*.76;
    initStars(); initFlakes();
  }
  window.addEventListener("resize", resize);

  /* ---------------- 启动 ---------------- */
  resize();
  buildParticles();
  buildOrnaments();
  requestAnimationFrame(loop);

  if(skipIntro){ const introEl=$("intro"); introEl.classList.add("hide"); introEl.style.display="none"; }
  else setTimeout(()=>$("intro").classList.add("hide"), 3600);

  function $(id){ return document.getElementById(id); }
})();
</script>
</body>
</html>
